services:
  mongodb:
    image: mongo:8
    container_name: studentops-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: studentops
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: studentops-api
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - .env.docker
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: studentops-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mongodb_data: