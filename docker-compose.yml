services:
  mongodb:
    image: mongo:8
    container_name: studentops-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: studentops
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: studentops-api
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URL: mongodb://mongodb:27017/studentops
      JWT_ACCESS_SECRET: studentops-docker-access-secret-change-me
      JWT_REFRESH_SECRET: studentops-docker-refresh-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      WEB_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "5000:5000"

volumes:
  mongodb_data: